<!DOCTYPE html>
<html>
<head>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000}
  #wrap{position:absolute;top:50%;left:50%;width:118vw;height:118vh;
      transform:translate(-50%,-50%);pointer-events:none}
  #player{width:100%;height:100%}
</style>
</head>
<body>
<div id="wrap"><div id="player"></div></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
function onYouTubeIframeAPIReady(){
  new YT.Player('player',{
    videoId:'f17J3AXVK5w',
    playerVars:{autoplay:1,mute:1,controls:0,modestbranding:1,rel:0,
                iv_load_policy:3,disablekb:1,playsinline:1,fs:0},
    events:{
      onReady:function(e){e.target.mute();e.target.playVideo();},
      e.target.setPlaybackQuality('hd1080');
      onStateChange:function(e){
        if(e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.ENDED){
          e.target.playVideo();
        }
      }
    }
  });
}
</script>
</body>
</html>
