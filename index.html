<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Doom Clock</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000}
  #wrap{
    position:absolute;top:50%;left:50%;
    width:min(150vw,266.67vh);
    height:min(150vh,84.375vw);
    transform:translate(-50%,-50%) scale(0.667);
    pointer-events:none;
  }
  #player{width:100%;height:100%}
  #shield{position:fixed;inset:0;z-index:10}
</style>
</head>
<body>
<div id="wrap"><div id="player"></div></div>
<div id="shield"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
var p;

function onYouTubeIframeAPIReady(){
  p = new YT.Player('player',{
    videoId:'f17J3AXVK5w',
    playerVars:{
      autoplay:1, mute:1, controls:0, modestbranding:1, rel:0,
      iv_load_policy:3, disablekb:1, playsinline:1, fs:0,
      vq:'hd1080', origin:location.origin
    },
    events:{
      onReady:function(e){
        e.target.mute();
        e.target.playVideo();
        try{ e.target.setPlaybackQuality('hd1080'); }catch(err){}
      }
    }
  });
}
</script>
</body>
</html>
